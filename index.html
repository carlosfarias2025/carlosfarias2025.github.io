<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Links</title>
<style>
  :root {
    --bg: #101114;
    --card: #17181c;
    --card-hover: #1f2025;
    --text: #eaeaea;
    --muted: #8a8d95;
    --accent: #5b8cff;
    --border: #26272c;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  .profile {
    text-align: center;
    margin-bottom: 40px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 18px;
  }

  .profile h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .profile p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
  }

  .link-card:hover {
    background: var(--card-hover);
    border-color: #34363c;
    transform: translateY(-1px);
  }

  .link-card:active {
    transform: translateY(0);
  }

  .link-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--muted);
  }

  .link-card:hover .icon {
    color: var(--text);
  }

  .link-text {
    font-size: 15px;
    font-weight: 500;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .link-card {
      transition: none;
    }
  }
</style>
</head>
<body>
<main>

  <div class="profile">
    <img class="avatar" src="Foto_de_perfil.png" alt="Foto de perfil">
    <h1>Carlos Eduardo</h1>
    <p>Desenvolvedor de software júnior</p>
  </div>

  <div class="links">

    <a href="https://www.instagram.com/kariemiabr/" class="link-card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1"/>
      </svg>
      <span class="link-text">Instagram</span>
    </a>

    <a href="https://www.linkedin.com/in/carlos-eduardo-farias-5b7b9739b/" class="link-card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 4h16v16H4z" stroke-linejoin="round"/>
        <circle cx="8" cy="8.5" r="1"/>
        <path d="M7 12v6M7 12v6M11 12v6M11 12v6M11 15c0-1.7 1.3-3 3-3s3 1.3 3 3v3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="link-text">LinkedIn</span>
    </a>

    <a href="https://github.com/carlosfarias2025" class="link-card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.9 1.57 2.34 1.12 2.91.86.09-.66.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.61.69.5A10.03 10.03 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/>
      </svg>
      <span class="link-text">GitHub</span>
    </a>

  </div>

  <footer>
    &copy; 2026 Carlos Eduardo
  </footer>

</main>
</body>
</html>
